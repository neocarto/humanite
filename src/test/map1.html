<!doctype html>

<style>
  html body main {
    width: 100% !important;
    max-width: none !important;
  }
</style>

<notebook>
  <script id="imports" type="module" hidden>
    import * as viz from "npm:geoviz@1";
  </script>

  <script type="module" hidden>
    let world = FileAttachment("../../data/world.json").json();
  </script>

  <script type="module">
    const r = view(
      Inputs.range([10, 100], { value: 50, step: 1, label: "Radius" }),
    );
    const dodge = view(Inputs.toggle({ value: false, label: "Dodge" }));
  </script>

  <script id="simple map" type="module" hidden>
    let svg = viz.create({
      responsive: true,
      projection: "EqualEarth",
      zoomable: true,
    });
    svg.outline();
    svg.graticule({ stroke: "white", step: 30 });
    svg.path({ datum: world, fill: "white", fillOpacity: 0.3 });
    svg.header({ text: "Hello geoviz" });
  </script>

  <script type="module">
    let toto = svg.prop({
      id: "pop",
      data: world,
      var: "pop",
      fill: "red",
      fillOpacity: 0.7,
      dodge,
      k: r,
    });
  </script>

  <script type="module" hidden>
    display(svg.render({ order: [toto] }));
  </script>

  <script type="module">
    const main = document.querySelector("main");

    if (main) {
      main.style.setProperty("width", "100%", "important");
      main.style.setProperty("max-width", "none", "important");
    }
  </script>
</notebook>
