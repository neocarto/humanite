<!doctype html>
<notebook>
  <script type="text/markdown">
    ![Logo L'Humanité](https://upload.wikimedia.org/wikipedia/commons/8/85/Logo_L%27Humanit%C3%A9.svg)

    Ce répertoire héberge les cartes réaliées par Nicolas Lambert pour la rubrique Le regard du cartographe du journal l'Humanité.fr

    Toutes les sources sont disponibles ici : https://github.com/neocarto/humanite

    Voir aussi : https://observablehq.com/@neocarto/-/collection/lhumanite

    <hr/>
  </script>

  <script type="module">
    const prefix = "https://neocarto.github.io/humanite/";
    const maps = [{ folder: "test", name: "map1", title: "carte de test" }];
    const byFolder = d3.group(maps, (d) => d.folder);
    display(
      html`<div>
        ${Array.from(
          byFolder,
          ([folder, items]) =>
            html`<section>
              <h3>${folder}</h3>
              <ul>
                ${items.map(
                  (map) =>
                    html`<li>
                      <a
                        href="${prefix}${map.folder}/${map.name}.html"
                        target="_blank"
                        >${map.title}</a
                      >
                    </li>`,
                )}
              </ul>
            </section>`,
        )}
      </div>`,
    );
  </script>
</notebook>
